.suki-root{
  --bg:#08090A; --surface:#121414; --surface-2:#1A1D1C; --surface-3:#232725;
  --ink:#F3F4F0; --ink-2:#A9AEA7; --muted:#6E736C;
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
  --green:#2F7A47; --green-2:#4CA86A; --green-3:#7FD79A;
  --green-soft:rgba(47,122,71,.16);
  --warn:#C08A4A; --warn-soft:rgba(192,138,74,.15);
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; color:var(--ink); background:var(--bg);
}
.suki-root *{box-sizing:border-box;}
.suki-root button{font-family:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.suki-root input,.suki-root textarea{font-family:inherit;color:inherit;}
.suki-root :focus-visible{outline:2px solid var(--green-2);outline-offset:2px;border-radius:8px;}

.stage{min-height:100vh;background:#000;display:flex;justify-content:center;align-items:stretch;}
.phone{width:100%;max-width:430px;background:var(--bg);position:relative;overflow:hidden;
  display:flex;flex-direction:column;min-height:100vh;}
@media(min-width:640px){
  .stage{padding:28px 0;align-items:center;}
  .phone{border-radius:46px;min-height:0;height:min(900px,calc(100vh - 56px));
    box-shadow:0 30px 90px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.08);}
}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 148px;}
.scroll.flush{padding-left:0;padding-right:0;}
.scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar{width:0;height:0;}

.h-xl{font-size:32px;line-height:1.05;letter-spacing:-.03em;font-weight:680;}
.h-lg{font-size:24px;line-height:1.1;letter-spacing:-.026em;font-weight:660;}
.h-md{font-size:18px;line-height:1.2;letter-spacing:-.018em;font-weight:640;}
.h-sm{font-size:15px;line-height:1.28;letter-spacing:-.01em;font-weight:600;}
.body{font-size:14px;line-height:1.55;color:var(--ink-2);letter-spacing:-.004em;}
.sub{font-size:12.5px;line-height:1.45;color:var(--muted);letter-spacing:-.002em;}
.label{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.label.g{color:var(--green-3);}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.035em;}
.big{font-size:46px;font-weight:680;line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums;}

.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:17px;}
.card.tight{padding:13px;border-radius:var(--r-md);}
.row{display:flex;align-items:center;gap:11px;}
.between{display:flex;align-items:center;justify-content:space-between;gap:11px;}
.stack{display:flex;flex-direction:column;}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g18{gap:18px}.g20{gap:20px}.g26{gap:26px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt18{margin-top:18px}.mt26{margin-top:26px}
.divider{height:1px;background:var(--line-2);}
.flex1{flex:1;}

.sketch-rule{display:block;opacity:.6;}
.grain{position:absolute;inset:0;opacity:.05;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.7) .5px,transparent .5px);background-size:3px 3px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;
  border-radius:999px;background:var(--green);color:#fff;font-size:15.5px;font-weight:650;letter-spacing:-.01em;
  transition:transform .12s ease,filter .12s ease;}
.btn:active{transform:scale(.97);filter:brightness(1.12);}
.btn.light{background:var(--ink);color:#0A0B0A;}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
.btn.full{width:100%;}
.btn.sm{height:40px;font-size:14px;padding:0 16px;}
.btn[disabled]{opacity:.35;}

.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line-2);font-size:13px;font-weight:540;transition:transform .12s ease;}
.chip:active{transform:scale(.96);}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:620;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}

.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.quick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);padding:13px 6px;
  transition:transform .12s ease,background .12s ease;}
.quick:active{transform:scale(.955);background:var(--surface-2);}
.quick span{font-size:12px;font-weight:560;}

.tabbar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);
  padding:10px 6px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:rgba(8,9,10,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line-2);z-index:40;}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;color:var(--muted);transition:color .15s;}
.tab.on{color:var(--ink);}
.tab.on i{background:var(--green-2);}
.tab i{width:4px;height:4px;border-radius:2px;background:transparent;display:block;}
.tab em{font-size:10px;font-style:normal;font-weight:560;}
.fab{position:absolute;right:18px;z-index:45;width:56px;height:56px;border-radius:999px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--green);
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 10px 28px rgba(47,122,71,.42);transition:transform .14s ease;}
.fab:active{transform:scale(.92);}

.overlay{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  animation:slideIn .3s cubic-bezier(.32,.72,0,1);}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.navbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px;}
.navbar .t{font-size:15.5px;font-weight:640;flex:1;text-align:center;}
.iconbtn{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:1px solid var(--line-2);flex:none;}
.scrim{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;animation:fade .2s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--surface);border-top:1px solid var(--line);
  border-radius:28px 28px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 20px);
  max-height:90%;overflow-y:auto;animation:up .32s cubic-bezier(.32,.72,0,1);}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 14px;}

.field{width:100%;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:12px 13px;font-size:15px;resize:none;}
.field::placeholder{color:var(--muted);}

.bar-track{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;background:var(--green);transition:width .7s cubic-bezier(.32,.72,0,1);}

.plan{display:flex;align-items:center;gap:12px;padding:13px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r-md);width:100%;text-align:left;transition:transform .12s;}
.plan:active{transform:scale(.985);}
.tickbox{width:23px;height:23px;border-radius:999px;border:1.5px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;transition:all .18s;}
.tickbox.on{background:var(--green);border-color:var(--green);color:#fff;}

.toast{position:absolute;left:18px;right:18px;z-index:90;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
  background:var(--surface-3);border:1px solid var(--line);color:var(--ink);border-radius:15px;
  padding:13px 15px;font-size:14px;font-weight:540;display:flex;align-items:center;gap:9px;
  animation:up .24s cubic-bezier(.32,.72,0,1);}

.friend-av{border-radius:999px;object-fit:cover;flex:none;border:1.5px solid var(--line);}
.bubble{background:var(--surface-2);border:1px solid var(--line-2);border-radius:18px 18px 18px 6px;
  padding:13px 15px;font-size:14.5px;line-height:1.5;}

.sk-tile{background:#0C0D0C;border:1px solid var(--line-2);display:block;object-fit:contain;}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to top,#08090A 4%,rgba(8,9,10,.15) 55%,rgba(8,9,10,.5) 100%);}
@media(prefers-reduced-motion:reduce){.suki-root *{animation-duration:.001ms!important;transition-duration:.001ms!important;}}
