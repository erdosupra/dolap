.dolap{
  --bg:#070707; --surface:#101010; --surface-2:#181818; --surface-3:#222;
  --ink:#F2EFE9; --ink-2:#A8A49B; --muted:#6D6A63;
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.055);
  --gold:#B99A55; --gold-2:#D7BC7E; --gold-soft:rgba(185,154,85,.14);
  --r:18px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;color:var(--ink);background:var(--bg);
}
.dolap *{box-sizing:border-box;}
.dolap button{font-family:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.dolap input,.dolap textarea,.dolap select{font-family:inherit;color:inherit;}
.dolap :focus-visible{outline:1.5px solid var(--gold);outline-offset:2px;}

.stage{min-height:100vh;background:#000;display:flex;justify-content:center;}
.phone{width:100%;max-width:430px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:100vh;}
@media(min-width:640px){
  .stage{padding:26px 0;align-items:center;}
  .phone{border-radius:44px;min-height:0;height:min(900px,calc(100vh - 52px));border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 90px rgba(0,0,0,.8);}
}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 140px;}
.scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar{width:0;height:0;}

.serif{font-family:"Didot","Bodoni 72","Playfair Display",Georgia,"Times New Roman",serif;}
.h1{font-size:30px;line-height:1.06;letter-spacing:.01em;font-weight:500;}
.h2{font-size:21px;line-height:1.12;letter-spacing:.01em;font-weight:500;}
.h3{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25;}
.body{font-size:14px;line-height:1.55;color:var(--ink-2);}
.sub{font-size:12.5px;line-height:1.45;color:var(--muted);}
.label{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
.label.g{color:var(--gold-2);}
.num{font-variant-numeric:tabular-nums;}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(185,154,85,0));}
.divider{height:1px;background:var(--line-2);}

.row{display:flex;align-items:center;gap:10px;}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stack{display:flex;flex-direction:column;}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt18{margin-top:18px}.mt26{margin-top:26px}
.flex1{flex:1}

.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:16px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:999px;
  background:var(--gold);color:#0B0B0B;font-size:15px;font-weight:650;letter-spacing:.01em;transition:transform .12s,filter .12s;}
.btn:active{transform:scale(.97);filter:brightness(1.1);}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
.btn.full{width:100%;}
.btn.sm{height:42px;font-size:13.5px;padding:0 16px;}
.btn[disabled]{opacity:.35;}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line-2);font-size:12.5px;font-weight:520;transition:transform .12s;}
.chip:active{transform:scale(.96);}
.chip.on{background:var(--gold);border-color:var(--gold);color:#0B0B0B;font-weight:640;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.iconbtn{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--line-2);flex:none;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.tile{position:relative;border-radius:14px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line-2);
  aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;transition:transform .12s;}
.tile:active{transform:scale(.97);}
.tile img{width:100%;height:100%;object-fit:cover;display:block;}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:20px 10px 8px;text-align:left;
  background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0));}
.empty{color:var(--muted);font-size:11.5px;}

.tabbar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);
  padding:10px 6px calc(env(safe-area-inset-bottom,0px) + 10px);background:rgba(7,7,7,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line-2);z-index:40;}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0;color:var(--muted);transition:color .15s;}
.tab.on{color:var(--gold-2);}
.tab em{font-size:10px;font-style:normal;font-weight:600;letter-spacing:.1em;text-transform:uppercase;}
.fab{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:45;
  width:56px;height:56px;border-radius:999px;background:var(--gold);color:#0B0B0B;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(185,154,85,.3);transition:transform .14s;}
.fab:active{transform:scale(.92);}

.overlay{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;animation:slide .28s cubic-bezier(.32,.72,0,1);}
@keyframes slide{from{transform:translateX(22px);opacity:0}to{transform:none;opacity:1}}
.navbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px;}
.navbar .t{flex:1;text-align:center;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;}
.scrim{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;animation:fade .2s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--surface);border-top:1px solid var(--line);border-radius:26px 26px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:92%;overflow-y:auto;animation:up .3s cubic-bezier(.32,.72,0,1);}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 14px;}
.field{width:100%;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:12px 13px;font-size:15px;}
.field::placeholder{color:var(--muted);}
.toast{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:90;
  background:var(--surface-3);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:14px;
  display:flex;align-items:center;gap:9px;animation:up .22s;}
.swatch{width:14px;height:14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);flex:none;}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:999px;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.dolap *{animation-duration:.001ms!important;transition-duration:.001ms!important;}}
